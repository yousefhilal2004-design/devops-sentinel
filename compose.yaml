
name: devops-sentinel

services:

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================

  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # FASTAPI APPLICATION
  # ==========================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-sentinel:stage09
    restart: unless-stopped

    env_file:
      - .env.compose

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - frontend
      - backend

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # BACKGROUND WORKER
  # ==========================================

  worker:
    image: devops-sentinel:stage09
    restart: unless-stopped

    command:
      - python
      - -m
      - worker.main

    env_file:
      - .env.compose

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  # ==========================================
  # PROMETHEUS
  # ==========================================

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - frontend

    depends_on:
      api:
        condition: service_healthy

  # ==========================================
  # GRAFANA
  # ==========================================

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - frontend

    depends_on:
      - prometheus

# ==========================================
# NETWORKS
# ==========================================

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
