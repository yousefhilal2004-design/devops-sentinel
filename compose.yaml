
name: devops-sentinel

services:

  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: devops-sentinel:stage07
    restart: unless-stopped

    env_file:
      - .env.compose

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - frontend
      - backend

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: devops-sentinel:stage07
    restart: unless-stopped

    command:
      - python
      - -m
      - worker.main

    env_file:
      - .env.compose

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge

volumes:
  postgres_data:
