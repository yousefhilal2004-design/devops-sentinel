
name: DevOps Sentinel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality:
    name: Code Quality and Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app worker tests

      - name: Ruff lint
        run: |
          python -m ruff check app worker tests

      - name: Ruff formatting
        run: |
          python -m ruff format --check app worker tests

      - name: Prepare example Compose environment
        run: |
          cp .env.compose.example .env.compose

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.compose config --quiet

  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: sentinel_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql://sentinel:ci_test_only_password@127.0.0.1:5433/sentinel_test
      ALLOWED_MONITOR_HOSTS: example.com
      MONITOR_INTERVAL_SECONDS: "30"
      MONITOR_TIMEOUT_SECONDS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v

  docker-security:
    name: Docker Build and Security
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: devops-sentinel:ci

      - name: Inspect image user
        run: |
          USER_NAME="$(docker image inspect devops-sentinel:ci --format '{{.Config.User}}')"
          echo "Configured image user: $USER_NAME"
          test "$USER_NAME" = "sentinel"

      - name: Verify Python in image
        run: |
          docker run --rm \
            --entrypoint python \
            devops-sentinel:ci \
            --version

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: devops-sentinel:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln
